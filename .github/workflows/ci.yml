name: Build and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    env:
      WHISPER_DONT_GENERATE_BINDINGS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - run: python3 -m pip install cmake==3.31.6
      - run: python3 scripts/verify-vendor.py
      - run: python3 scripts/verify-sherpa-abi.py
      - run: cargo fmt --check
      - run: cargo test --offline --locked --lib
      - run: cargo clippy --offline --locked --all-targets --no-deps -- -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --offline --locked --release
      - name: Download pinned test inputs before isolated inference
        run: |
          python3 scripts/fetch-bengali-test-pack.py --platform linux-x64 --output "model-packs/বাংলা"
          python3 scripts/fetch-bengali-corpus.py model-packs/fleurs-bn-30
      - name: Native Bengali worker without a network namespace connection
        run: |
          sudo unshare -n -- python3 scripts/smoke-native-bengali.py target/release/voicetotext "model-packs/বাংলা/bengali.vtt-model.json" "model-packs/বাংলা-downloads/test-wavs" native-verification/smoke
          sudo unshare -n -- python3 scripts/benchmark-worker.py target/release/voicetotext "model-packs/বাংলা/bengali.vtt-model.json" model-packs/fleurs-bn-30/corpus.csv native-verification/fleurs --cpu-profile "GitHub Ubuntu x64; native CPU/2 threads; no network namespace; sequential" --no-timestamps
          python3 scripts/verify-native-bengali-results.py native-verification/fleurs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Linux-native-Bengali-verification
          path: native-verification/
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: python -m pip install cmake==3.31.6
      - run: python scripts/verify-vendor.py
      - name: Test and build with the Windows SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set LIBCLANG_PATH=C:\Program Files\LLVM\bin
          python scripts/verify-sherpa-abi.py
          if errorlevel 1 exit /b 1
          cargo test --offline --locked --lib
          if errorlevel 1 exit /b 1
          cargo test --offline --locked --bin voicetotext --no-run
          if errorlevel 1 exit /b 1
          cargo build --offline --locked --release
          if errorlevel 1 exit /b 1
          dumpbin /dependents target\release\voicetotext.exe > windows-imports.txt
          if errorlevel 1 exit /b 1
      - name: Prepare pinned test inputs
        shell: pwsh
        run: |
          python scripts/fetch-bengali-test-pack.py --platform windows-x64 --output "model-packs/বাংলা"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fetch-bengali-corpus.py model-packs/fleurs-bn-30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Bengali worker with explicit outbound block
        shell: pwsh
        run: |
          $nativeProgram = (Resolve-Path target/release/voicetotext.exe).Path
          New-NetFirewallRule -DisplayName VoiceToText-native-CI -Direction Outbound -Program $nativeProgram -Action Block -ErrorAction Stop | Out-Null
          try {
            python scripts/smoke-native-bengali.py target/release/voicetotext.exe "model-packs/বাংলা/bengali.vtt-model.json" "model-packs/বাংলা-downloads/test-wavs" native-verification/smoke
            if ($LASTEXITCODE -ne 0) { throw "Native compatibility smoke failed" }
            python scripts/benchmark-worker.py target/release/voicetotext.exe "model-packs/বাংলা/bengali.vtt-model.json" model-packs/fleurs-bn-30/corpus.csv native-verification/fleurs --cpu-profile "GitHub Windows x64; native CPU/2 threads; explicit outbound rule; sequential" --no-timestamps
            if ($LASTEXITCODE -ne 0) { throw "Native benchmark failed" }
            python scripts/verify-native-bengali-results.py native-verification/fleurs
            if ($LASTEXITCODE -ne 0) { throw "Native integration parity failed" }
          } finally {
            Remove-NetFirewallRule -DisplayName VoiceToText-native-CI -ErrorAction Stop
          }
      - name: Package experimental Bengali app
        shell: pwsh
        run: |
          python scripts/package-bengali-experimental.py target/release/voicetotext.exe "model-packs/বাংলা" dist/VoiceToText-Bengali-Experimental --verification native-verification --imports windows-imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Windows-native-Bengali-verification
          path: native-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-experimental-Bengali-alpha3
          path: dist/VoiceToText-Bengali-Experimental/
          if-no-files-found: error
