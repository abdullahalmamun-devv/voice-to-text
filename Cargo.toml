[package]
name = "voicetotext"
version = "0.2.0-alpha.2"
edition = "2021"
rust-version = "1.85"
description = "Offline Bengali-first desktop dictation"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hound = "3.5"
whisper-rs = { version = "=0.15.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Multimedia",
  "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Power", "Win32_Security", "Win32_UI_HiDpi", "Win32_System_Registry"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
whisper-rs = { path = "vendor/whisper-rs" }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

